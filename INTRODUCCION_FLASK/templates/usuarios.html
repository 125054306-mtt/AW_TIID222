<!-- HEREDAR LA PLANTILLA -->
{% extends 'navbar_footer.html' %} 

{% block title %} 
Panel de usuario
{% endblock %}

<!-- CONTENIDO DE LA PLANTILLA -->
{% block content %} 
<div class="max-w-4xl mx-auto my-8">
    <div class="card bg-base-100 shadow-xl border border-base-300">
        <div class="card-body">
            <div class="flex items-center gap-2">
                <span class="badge badge-secondary">Usuario</span>
            </div>
            <h1 class="card-title text-3xl font-bold mt-2">
                Bienvenido, {{ nombre }}!
            </h1>
            <p class="mt-4">
                Este es el contenido del usuario
            </p>
        </div>
    </div>
</div>
{% endblock %}
