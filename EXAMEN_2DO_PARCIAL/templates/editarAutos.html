<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Autos</title>
</head>
<body>

    <div>
        <h1>Autos a editar</h1>
        <form action="/actualizar/{{Autos.0}}" method="post">
            <input type="text" name="txtMarca" value="{{Autos.1}}">
            <input type="text" name="txtModelo" value="{{Autos.2}}">
            <input type="text" name="txtAnio" value="{{Autos.3}}">
            <button type="submit">Actualizar</button>
        </form>
    </div>
    
</body>
</html>
